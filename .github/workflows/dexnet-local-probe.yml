name: DExNet local assembly research
on:
  push:
    branches: [main]
    paths:
      - 'dexnet/probe.py'
      - 'dexnet/recipe-v1.json'
      - '.github/workflows/dexnet-local-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dexnet-local-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: |
          python -m pip install 'gdown==5.2.0' 'PyWavelets==1.7.0' 'numpy==1.26.4' 'Pillow==11.3.0' 'onnx==1.17.0'
          python -m pip install 'torch==2.4.1+cpu' 'torchvision==0.19.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Check pinned original components and byte-exact reconstruction
        run: python dexnet/probe.py
