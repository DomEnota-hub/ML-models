name: Publish audited DExNet v1 graph recipe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dexnet-publish-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dexnet-publish-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'gdown==5.2.0' 'PyWavelets==1.7.0' 'numpy==1.26.4' 'Pillow==11.3.0' 'onnx==1.17.0'
          python -m pip install 'torch==2.4.1+cpu' 'torchvision==0.19.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce audited output and strip trained ranges
        env:
          ML_DEXNET_EXPORT_TEMPLATE: audited
        run: python dexnet/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: untrained-dexnet-v1-recipe
          path: |
            audited/graph.skeleton.gz
            audited/ranges.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: research
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: untrained-dexnet-v1-recipe
          path: audited
      - name: Validate only approved graph recipe and publish once
        run: |
          set -euo pipefail
          test ! -e dexnet/v1
          python - <<'PY'
          import gzip, hashlib, json, pathlib
          p = pathlib.Path("audited")
          assert {x.name for x in p.iterdir()} == {"graph.skeleton.gz", "ranges.json"}
          m = json.loads((p/"ranges.json").read_text())
          data = (p/"graph.skeleton.gz").read_bytes()
          assert m["outputSha256"] == "0898eefd440b3adfc13b32b49b14c94e1acbf9b5ad5270f4022513b891a90917"
          assert m["outputBytes"] == 91341128 and m["skeletonBytes"] == 1548204
          assert len(data) == m["compressedBytes"] and len(data) < 2_000_000
          assert hashlib.sha256(data).hexdigest() == m["compressedSha256"]
          skeleton = gzip.decompress(data)
          assert len(skeleton) == 1548204 and hashlib.sha256(skeleton).hexdigest() == m["skeletonSha256"]
          assert len(m["ranges"]) == 1854 and sum(r["length"] for r in m["ranges"]) == 89792924
          assert len((p/"ranges.json").read_bytes()) < 1_000_000
          PY
          mkdir dexnet/v1
          cp audited/graph.skeleton.gz audited/ranges.json dexnet/v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dexnet/v1/graph.skeleton.gz dexnet/v1/ranges.json
          git commit -m "Publish verified DExNet v1 untrained graph skeleton and range recipe"
          git push origin HEAD:main
